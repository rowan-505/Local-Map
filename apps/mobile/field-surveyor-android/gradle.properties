org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
android.useAndroidX=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# Non-secret Fastify origin only.
# Real phone (debug): set fieldApiBaseUrl in local.properties (gitignored). Do not commit a LAN IP.
# CLI: -PfieldApiBaseUrl=http://192.168.x.x:3001
# Debug default with no override: emulator loopback http://10.0.2.2:3001 (will not work on a physical phone)
# Release default: https://api.invalid.coremap.local unless you pass -PfieldApiBaseUrl=https://...
# Do not put JWT secrets, R2 keys, or database URLs here.
